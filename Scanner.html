<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ماسح الدعوات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{font-family:Cairo;background:#0a0a0b;color:#fff;margin:0;padding:16px}.card{max-width:520px;margin:0 auto;background:#111;border:1px solid #222;border-radius:20px;padding:16px}#reader{border-radius:16px;background:#000}.btn{width:100%;height:50px;border-radius:14px;border:0;font-weight:800;font-family:Cairo;cursor:pointer;margin-top:10px}.gold{background:#D4AF37;color:#000}.dark{background:#1a1a1c;color:#fff;border:1px solid #333}.ok{background:#0f2a14;border:1px solid #2a6b3a;color:#6f6;padding:16px;border-radius:16px;margin-top:16px}.bad{background:#2a1111;border:1px solid #6b2a2a;color:#f99;padding:16px;border-radius:16px;margin-top:16px}</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center">📷 ماسح دعوات القاعة</h2>
<div style="background:#D4AF37/10;border:1px solid #D4AF37/30;color:#D4AF37;padding:10px;border-radius:10px;font-size:12px;text-align:center">خلي الـ QR جوه المربع وقرب الموبايل</div>
<div id="reader" style="margin-top:12px"></div>
<div id="status" style="text-align:center;margin-top:8px;color:#888;font-size:12px">بشغل الكاميرا...</div>
<input type="file" id="file" accept="image/*" hidden>
<button class="btn dark" onclick="document.getElementById('file').click()">🖼️ رفع صورة الكارت لو الكاميرا مش لاقطة</button>
<input id="manual" style="width:100%;height:44px;background:#121214;border:1px solid #333;border-radius:12px;color:#fff;padding:0 12px;margin-top:10px;box-sizing:border-box" placeholder="أو الصق الكود هنا">
<button class="btn gold" id="check">فحص</button>
<div id="res"></div>
</div>
<script>
let qr=new Html5Qrcode("reader");
function show(t,ok=true){
 const d=document.getElementById('res');
 try{
  let raw=t.includes('?invite=')?decodeURIComponent(t.split('?invite=')[1].split('&')[0]):t;
  let j=JSON.parse(atob(raw));
  const now=new Date(), s=new Date(j.start), e=new Date(j.end);
  const valid=now>=s&&now<=e;
  d.innerHTML=valid?`<div class=ok><div style="font-size:30px">✅</div><b>صالح للدخول</b><br>${j.hall}<br>${j.groom} & ${j.bride}<br>المدعو: ${j.guestName||'عام'}<br>${j.token}</div>`:`<div class=bad><div style="font-size:30px">❌</div><b>منتهي أو لم يبدأ</b><br>${j.hall}</div>`;
  if(valid&&navigator.vibrate) navigator.vibrate(200);
 }catch(err){
  d.innerHTML=`<div class=bad>❌ كود غير صالح<br><small>${t.slice(0,100)}</small></div>`;
 }
}
Html5Qrcode.getCameras().then(c=>{
 qr.start(c[0]?.id||{facingMode:"environment"},{fps:15,qrbox:250},show,()=>{}).then(()=>document.getElementById('status').innerText='وجه الكاميرا على الـ QR').catch(e=>document.getElementById('status').innerText='افتح من Safari/Chrome - الكاميرا ممنوعة هنا');
});
document.getElementById('file').onchange=async e=>{
 try{const r=await new Html5Qrcode("reader").scanFile(e.target.files[0],true); show(r);}catch{alert('الصورة مش واضحة جرب صورة أوضح');}
};
document.getElementById('check').onclick=()=>{const v=document.getElementById('manual').value.trim(); if(v) show(v);};
</script>
</body>
</html>
