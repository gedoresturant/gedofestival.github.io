<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>نظام دعوات القاعة - كامل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:'Cairo',sans-serif;background:#0a0a0b;color:#fff;margin:0;padding:0}
.header{padding:20px;text-align:center;border-bottom:1px solid #1a1a1a;position:sticky;top:0;background:#0a0a0b;z-index:10}
.header h1{margin:0;font-size:22px;color:#D4AF37}
.header p{margin:4px 0 0;color:#888;font-size:12px}
.tabs{display:flex;gap:8px;justify-content:center;margin-top:12px}
.tab{padding:10px 18px;border-radius:12px;border:1px solid #222;background:#111;color:#888;cursor:pointer;font-family:Cairo;font-weight:700;font-size:13px}
.tab.active{background:#D4AF37;color:#000;border-color:#D4AF37}
.container{max-width:560px;margin:0 auto;padding:16px}
.card{background:#111114;border:1px solid #232326;border-radius:20px;padding:18px;margin-bottom:16px}
label{font-size:12px;color:#aaa;display:block;margin-bottom:6px;margin-top:12px}
input,select{width:100%;height:46px;background:#121214;border:1px solid #232326;border-radius:12px;color:#fff;padding:0 12px;font-family:Cairo}
.btn{width:100%;height:50px;border-radius:14px;border:0;font-family:Cairo;font-weight:800;cursor:pointer;margin-top:12px;font-size:14px}
.btn-gold{background:#D4AF37;color:#000}
.btn-dark{background:#1e1e20;color:#fff;border:1px solid #333}
.btn:disabled{opacity:0.5}
.qr-wrap{display:flex;justify-content:center;margin:16px 0}
#qrcodeCanvas{background:#fff;padding:12px;border-radius:16px}
#reader{border-radius:16px;overflow:hidden;background:#000;min-height:300px}
.result{padding:18px;border-radius:16px;margin-top:16px;text-align:center;display:none}
.result.ok{background:#0f2a14;border:1px solid #22c55e;color:#86efac;display:block}
.result.bad{background:#2a1111;border:1px solid #ef4444;color:#fca5a5;display:block}
.result.warn{background:#2a2211;border:1px solid #eab308;color:#fde68a;display:block}
.log-item{display:flex;justify-content:space-between;padding:10px;background:#121214;border:1px solid #222;border-radius:10px;margin-bottom:6px;font-size:12px}
.badge{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800}
.badge-ok{background:#22c55e;color:#000}
.badge-bad{background:#ef4444;color:#fff}
</style>
</head>
<body>
<div class="header">
<h1>🏛️ نظام دعوات القاعة الذكي</h1>
<p>QR + PDF + فحص مباشر + Excel</p>
<div class="tabs">
<button class="tab active" id="tab-create" onclick="showTab('create')">إنشاء دعوة</button>
<button class="tab" id="tab-scan" onclick="showTab('scan')">فحص الدعوات 📷</button>
<button class="tab" id="tab-log" onclick="showTab('log')">السجل 📊</button>
</div>
</div>

<div class="container">
<!-- CREATE -->
<div id="view-create">
<div class="card">
<h3 style="margin:0 0 10px;color:#D4AF37">بيانات الفرح</h3>
<label>اسم القاعة</label><input id="hall" value="قاعة الماسة" placeholder="قاعة الماسة">
<label>اسم العريس</label><input id="groom" placeholder="محمد">
<label>اسم العروسة</label><input id="bride" placeholder="سارة">
<label>تاريخ الفرح</label><input id="date" type="date">
<div style="display:flex;gap:8px"><div style="flex:1"><label>من الساعة</label><input id="start" type="time" value="20:00"></div><div style="flex:1"><label>حتى الساعة</label><input id="end" type="time" value="23:59"></div></div>
<label>اسم المدعو (اختياري - سيبه فاضي لدعوة عامة)</label><input id="guest" placeholder="مثال: أحمد محسن - العائلة">
<button class="btn btn-gold" onclick="generate()">✨ إنشاء كارت الدعوة + QR</button>
</div>

<div id="previewCard" class="card" style="display:none">
<h3 style="text-align:center;margin:0;color:#D4AF37">كارت الدعوة</h3>
<div style="background:linear-gradient(135deg,#1a1a1a,#111);border:1px solid #D4AF37/30;border-radius:16px;padding:20px;margin-top:12px;text-align:center">
<div style="font-size:11px;color:#D4AF37;letter-spacing:2px">WEDDING INVITATION</div>
<h2 id="p-hall" style="margin:8px 0"></h2>
<div style="color:#888;font-size:12px" id="p-date"></div>
<h3 style="margin:16px 0"><span id="p-groom"></span> <span style="color:#D4AF37">♥</span> <span id="p-bride"></span></h3>
<div class="qr-wrap"><canvas id="qrcodeCanvas"></canvas></div>
<div style="font-size:11px;color:#666;word-break:break-all" id="p-token"></div>
<div style="margin-top:10px;font-size:12px;color:#aaa" id="p-guest"></div>
</div>
<button class="btn btn-dark" onclick="downloadPDF()">📄 تحميل كارت PDF بالـ QR</button>
<button class="btn btn-dark" onclick="copyLink()">🔗 نسخ رابط الدعوة</button>
<div id="linkBox" style="margin-top:10px;font-size:10px;color:#555;word-break:break-all;background:#0a0a0a;padding:8px;border-radius:8px;display:none"></div>
</div>
</div>

<!-- SCAN -->
<div id="view-scan" style="display:none">
<div class="card">
<div style="background:#D4AF37/10;border:1px solid #D4AF37/20;color:#D4AF37;padding:10px;border-radius:12px;font-size:12px;line-height:1.7;text-align:center">خلي الـ QR في نص المربع - قرب الموبايل 15 سم - لو الإضاءة ضعيفة شغل الفلاش 🔦</div>
<div id="reader" style="margin-top:12px"></div>
<div style="display:flex;gap:8px;margin-top:10px">
<button class="btn btn-dark" id="startCamBtn" style="flex:1" onclick="startCamera()">📷 تشغيل الكاميرا</button>
<button class="btn btn-dark" id="torchBtn" style="flex:0.5;display:none" onclick="toggleTorch()">🔦 فلاش</button>
</div>
<div id="camStatus" style="text-align:center;font-size:11px;color:#666;margin-top:8px">اضغط تشغيل الكاميرا</div>
<input type="file" id="fileInput" accept="image/*" hidden>
<button class="btn btn-dark" onclick="document.getElementById('fileInput').click()">🖼️ رفع صورة الكارت (لو الكاميرا مش لاقطة)</button>
<input id="manualCode" style="margin-top:10px" placeholder="أو الصق كود الدعوة هنا">
<button class="btn btn-gold" onclick="checkManual()">فحص الكود</button>
<div id="scanResult" class="result"></div>
<div style="margin-top:16px;text-align:center"><span style="background:#111;border:1px solid #222;padding:8px 16px;border-radius:20px;font-size:12px">إجمالي الدخول اليوم: <b id="totalCount" style="color:#D4AF37">0</b></span></div>
</div>
</div>

<!-- LOG -->
<div id="view-log" style="display:none">
<div class="card">
<h3 style="margin:0;color:#D4AF37">سجل الحضور</h3>
<p style="font-size:11px;color:#888;margin:6px 0">كل Scan بيتحفظ هنا تلقائياً - يعمل Offline</p>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn btn-dark" style="flex:1;height:40px" onclick="exportCSV()">📥 تحميل Excel CSV</button>
<button class="btn btn-dark" style="flex:1;height:40px" onclick="clearLog()">🗑️ مسح السجل</button>
</div>
<div id="logList" style="margin-top:16px"></div>
</div>
</div>

</div>

<script>
const { jsPDF } = window.jspdf;
let lastPayload = null;
let lastLink = "";
let html5QrCode = null;
let torchOn = false;
let totalLogs = JSON.parse(localStorage.getItem('checkin_logs')||'[]');

function showTab(t){
 document.getElementById('view-create').style.display = t==='create'?'block':'none';
 document.getElementById('view-scan').style.display = t==='scan'?'block':'none';
 document.getElementById('view-log').style.display = t==='log'?'block':'none';
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
 document.getElementById('tab-'+t).classList.add('active');
 if(t==='log') renderLog();
 if(t==='scan') updateCount();
}

function genToken(){ return 'WED-' + Math.random().toString(36).substr(2,9).toUpperCase(); }

function generate(){
 const hall=document.getElementById('hall').value||'قاعة';
 const groom=document.getElementById('groom').value||'العريس';
 const bride=document.getElementById('bride').value||'العروسة';
 const date=document.getElementById('date').value||new Date().toISOString().split('T')[0];
 const start=document.getElementById('start').value||'20:00';
 const end=document.getElementById('end').value||'23:59';
 const guest=document.getElementById('guest').value||'';
 const token=genToken();
 const startISO = new Date(date+'T'+start).toISOString();
 const endISO = new Date(date+'T'+end).toISOString();
 const payload={hall,groom,bride,date,guestName:guest,token,start:startISO,end:endISO,v:1};
 lastPayload=payload;
 const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
 const base = window.location.origin + window.location.pathname;
 lastLink = base + '?invite=' + encodeURIComponent(b64);

 document.getElementById('p-hall').innerText=hall;
 document.getElementById('p-groom').innerText=groom;
 document.getElementById('p-bride').innerText=bride;
 document.getElementById('p-date').innerText=date+' من '+start+' حتى '+end;
 document.getElementById('p-guest').innerText=guest?('مدعو: '+guest):'دعوة عامة';
 document.getElementById('p-token').innerText=token;
 document.getElementById('previewCard').style.display='block';
 document.getElementById('linkBox').style.display='block';
 document.getElementById('linkBox').innerText=lastLink;

 const canvas=document.getElementById('qrcodeCanvas');
 QRCode.toCanvas(canvas, lastLink, {width:280, margin:2, errorCorrectionLevel:'H', color:{dark:'#000', light:'#fff'}}, function(err){
   if(err) console.error(err);
 });
}

function downloadPDF(){
 if(!lastPayload) return;
 const doc = new jsPDF({orientation:'portrait',unit:'mm',format:'a5'});
 // background
 doc.setFillColor(17,17,20); doc.rect(0,0,148,210,'F');
 doc.setDrawColor(212,175,55); doc.setLineWidth(0.5); doc.rect(5,5,138,200);
 doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(212,175,55);
 doc.text('WEDDING INVITATION',74,18,{align:'center'});
 doc.setFontSize(18); doc.setTextColor(255,255,255); doc.text(lastPayload.hall,74,30,{align:'center'});
 doc.setFontSize(11); doc.setTextColor(180,180,180); doc.text(lastPayload.date,74,36,{align:'center'});
 doc.setFontSize(16); doc.setTextColor(255,255,255); doc.text(lastPayload.groom+'  ♥  '+lastPayload.bride,74,48,{align:'center'});
 // QR
 const canvas=document.getElementById('qrcodeCanvas');
 const imgData=canvas.toDataURL('image/png');
 doc.addImage(imgData,'PNG',44,55,60,60);
 doc.setFontSize(9); doc.setTextColor(150,150,150); doc.text(lastPayload.token,74,120,{align:'center'});
 if(lastPayload.guestName) { doc.setFontSize(12); doc.setTextColor(212,175,55); doc.text('مدعو: '+lastPayload.guestName,74,128,{align:'center'}); }
 doc.setFontSize(8); doc.setTextColor(100,100,100); doc.text('يُرجى إبراز هذا الكارت عند الدخول - كود صالح لمرة واحدة',74,195,{align:'center'});
 doc.save('دعوة-'+lastPayload.groom+'-'+lastPayload.token+'.pdf');
}

function copyLink(){
 if(!lastLink) return;
 navigator.clipboard.writeText(lastLink).then(()=>alert('تم نسخ الرابط ✅'));
}

function handleDecoded(text){
 const resBox=document.getElementById('scanResult');
 let raw=text.trim();
 try{
   if(raw.includes('?invite=')){ raw=raw.split('?invite=')[1].split('&')[0]; raw=decodeURIComponent(raw); }
   let jsonStr=atob(raw);
   try{ jsonStr=decodeURIComponent(escape(jsonStr)); }catch(e){}
   const payload=JSON.parse(jsonStr);
   const now=new Date(); const s=new Date(payload.start); const e=new Date(payload.end);
   const valid = now>=s && now<=e;
   const notStarted = now < s;
   // save
   let logs=JSON.parse(localStorage.getItem('checkin_logs')||'[]');
   let exists=logs.find(l=>l.token===payload.token);
   if(!exists){
     logs.push({...payload,scanTime:new Date().toISOString(),status:valid?'صالح':'منتهي'});
     localStorage.setItem('checkin_logs',JSON.stringify(logs));
     totalLogs=logs;
   }
   updateCount();
   if(valid){
     resBox.className='result ok';
     resBox.innerHTML=`<div style="font-size:32px">✅</div><div style="font-size:20px;font-weight:800">صالح للدخول</div><div style="margin-top:10px;background:rgba(0,0,0,0.4);padding:10px;border-radius:10px;font-size:13px"><div>🏛️ ${payload.hall}</div><div>🤵👰 ${payload.groom} ♥ ${payload.bride}</div><div>👤 ${payload.guestName||'عام'}</div><div style="font-size:11px;margin-top:6px">🔑 ${payload.token}</div></div>`;
     if(navigator.vibrate) navigator.vibrate(200);
   }else{
     resBox.className='result bad';
     resBox.innerHTML=`<div style="font-size:32px">❌</div><div style="font-weight:800">${notStarted?'لم يبدأ بعد':'منتهي الصلاحية'}</div><div style="margin-top:8px">${payload.hall} - ${payload.groom}</div>`;
     if(navigator.vibrate) navigator.vibrate([100,50,100]);
   }
   try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();o.frequency.value=valid?900:300;o.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),150);}catch(e){}
 }catch(err){
   resBox.className='result bad';
   resBox.innerHTML=`<div>❌ كود غير صالح</div><div style="font-size:10px;word-break:break-all;margin-top:6px">${text.slice(0,150)}</div>`;
 }
}

function startCamera(){
 const status=document.getElementById('camStatus');
 status.innerText='بشغل الكاميرا...';
 if(html5QrCode && html5QrCode.getState()===2){ html5QrCode.stop().then(()=>doStart()); } else { doStart(); }
 function doStart(){
   html5QrCode=new Html5Qrcode("reader");
   Html5Qrcode.getCameras().then(cams=>{
     const camId = cams.length?cams[0].id:{facingMode:"environment"};
     return html5QrCode.start(camId,{fps:15,qrbox:{width:260,height:260}},handleDecoded,()=>{});
   }).then(()=>{
     status.innerText='وجه الكاميرا على الـ QR - خليك ثابت';
     status.style.color='#22c55e';
     // torch button
     try{ const cap=html5QrCode.getRunningTrackCapabilities(); if(cap.torch) document.getElementById('torchBtn').style.display='block'; }catch(e){}
   }).catch(e=>{
     status.innerText='فشل: '+e+' - افتح من Chrome/Safari أو استخدم رفع صورة';
     status.style.color='#ef4444';
   });
 }
}

function toggleTorch(){
 if(!html5QrCode) return;
 torchOn=!torchOn;
 html5QrCode.applyVideoConstraints({advanced:[{torch:torchOn}]}).then(()=>{
   document.getElementById('torchBtn').innerText=torchOn?'🔦 إطفاء الفلاش':'🔦 فلاش';
 }).catch(()=>alert('الفلاش غير مدعوم في هذا الجهاز'));
}

document.getElementById('fileInput').addEventListener('change',async e=>{
 const file=e.target.files[0]; if(!file) return;
 try{
   const tmp=new Html5Qrcode("reader");
   const decoded=await tmp.scanFile(file,true);
   handleDecoded(decoded);
 }catch(err){ alert('مقدرتش أقرأ الصورة - جرب صورة أوضح وقرب الـ QR'); }
});

function checkManual(){
 const v=document.getElementById('manualCode').value.trim();
 if(v) handleDecoded(v);
}

function updateCount(){
 const logs=JSON.parse(localStorage.getItem('checkin_logs')||'[]');
 document.getElementById('totalCount').innerText=logs.length;
}

function renderLog(){
 const logs=JSON.parse(localStorage.getItem('checkin_logs')||'[]').reverse();
 const list=document.getElementById('logList');
 if(!logs.length){ list.innerHTML='<div style="text-align:center;color:#666;padding:20px">لا يوجد دخول بعد</div>'; return; }
 list.innerHTML=logs.map(l=>`<div class="log-item"><div><b>${l.guestName||'عام'}</b> - ${l.hall}<br><small>${new Date(l.scanTime).toLocaleString('ar-EG')} - ${l.token}</small></div><span class="badge ${l.status==='صالح'?'badge-ok':'badge-bad'}">${l.status}</span></div>`).join('');
 updateCount();
}

function exportCSV(){
 const logs=JSON.parse(localStorage.getItem('checkin_logs')||'[]');
 if(!logs.length){ alert('لا يوجد سجل'); return; }
 let csv='\uFEFFالقاعة,العريس,العروسة,المدعو,التوكن,وقت الدخول,الحالة\n';
 logs.forEach(l=>{ csv+=`"${l.hall}","${l.groom}","${l.bride}","${l.guestName||''}","${l.token}","${new Date(l.scanTime).toLocaleString('ar-EG')}","${l.status}"\n`; });
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='سجل-حضور-'+new Date().toISOString().split('T')[0]+'.csv'; a.click();
}

function clearLog(){
 if(confirm('متأكد تمسح السجل؟')){ localStorage.removeItem('checkin_logs'); renderLog(); updateCount(); }
}

// check if URL has invite -> show invitation view
(function(){
 const params=new URLSearchParams(window.location.search);
 if(params.has('invite')){
   try{
     let raw=decodeURIComponent(params.get('invite'));
     let j=JSON.parse(decodeURIComponent(escape(atob(raw))));
     document.body.innerHTML=`<div style="font-family:Cairo;background:#0a0a0b;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px"><div style="max-width:400px;width:100%;background:#111;border:1px solid #D4AF37;border-radius:20px;padding:24px;text-align:center"><div style="color:#D4AF37;font-size:10px;letter-spacing:3px">WEDDING INVITATION</div><h2 style="margin:10px 0">${j.hall}</h2><div style="color:#888">${j.date}</div><h3 style="margin:20px 0">${j.groom} ♥ ${j.bride}</h3><div style="background:#fff;padding:10px;border-radius:12px;display:inline-block"><canvas id="qr"></canvas></div><div style="margin-top:16px;color:#D4AF37">مدعو: ${j.guestName||'عام'}</div><div style="font-size:11px;color:#555;margin-top:6px">${j.token}</div><div style="margin-top:20px;font-size:12px;color:#aaa">أهلاً وسهلاً - يُرجى إبراز هذه الدعوة عند الدخول</div></div></div>`;
     setTimeout(()=>{ const c=document.getElementById('qr'); if(c) QRCode.toCanvas(c, window.location.href,{width:180,margin:1}); },300);
   }catch(e){}
 }
})();
document.getElementById('date').valueAsDate=new Date();
updateCount();
</script>
</body>
</html>
